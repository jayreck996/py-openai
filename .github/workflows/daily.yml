name: Daily OpenAI Fetch

on:
  schedule:
    - cron: "0 17 * * *"  # 6:00 AM NZDT (UTC+13)
  workflow_dispatch:        # allow manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Clear cached data and fetch fresh articles
        run: python run_daily.py

      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: daily fetch $(date -u +%Y-%m-%d)" && git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare feed artifact
        run: |
          mkdir -p _site
          cp feed.xml _site/feed.xml
          touch _site/.nojekyll

      - name: Upload feed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
