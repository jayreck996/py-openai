name: Daily OpenAI Fetch

on:
  schedule:
    - cron: "0 17 * * *"  # 6:00 AM NZDT (UTC+13)
  workflow_dispatch:        # allow manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Clear cached data for fresh fetch
        run: rm -rf data/

      - name: Discover and fetch new articles
        run: python run_daily.py

      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml feed_v13.xml
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: daily fetch $(date -u +%Y-%m-%d)" && git push
